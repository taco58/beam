[project]
name = "beam"
version = "0.1.0"
description = "Zero-config peer-to-peer file transfer in your terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
    "click>=8.1.7",
]

[project.scripts]
beam = "beam.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
